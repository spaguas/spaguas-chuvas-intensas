worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 server_tokens off;
 sendfile on;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 # Docker's DNS refresh prevents stale upstream addresses after API recreation.
 resolver 127.0.0.11 valid=10s ipv6=off;
 server {
  listen 8080;
  absolute_redirect off;
  root /usr/share/nginx/html;
  client_max_body_size 256k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /chuvas_intensas { return 308 /chuvas_intensas/; }
  location = / { return 302 /chuvas_intensas/; }
  location = /chuvas_intensas/api/admin/branding {
   client_max_body_size 2m;
   set $api_upstream http://api:3108;
   proxy_pass $api_upstream$request_uri;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_http_version 1.1;
   proxy_connect_timeout 5s;
   proxy_read_timeout 35s;
  }
  location ~ ^/chuvas_intensas/(api(?:/|$)|docs(?:/|$)|source(?:/|$)) {
   set $api_upstream http://api:3108;
   proxy_pass $api_upstream$request_uri;
   proxy_set_header Host $host;
   # Discard untrusted forwarded IP input; outer reverse proxy may define real_ip explicitly.
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_http_version 1.1;
   proxy_connect_timeout 5s;
   proxy_read_timeout 35s;
  }
  location /chuvas_intensas/assets/ {
   try_files $uri =404;
   expires 1y;
   add_header Cache-Control "public, immutable";
  }
  location /chuvas_intensas/ {
   try_files $uri $uri/ /chuvas_intensas/index.html;
   add_header Cache-Control "no-cache";
   add_header X-Content-Type-Options nosniff always;
   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  }
  location / { return 404; }
 }
}
