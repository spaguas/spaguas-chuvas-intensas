name: Validate
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chuvas
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: chuvas_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U chuvas -d chuvas_test" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://chuvas:ci-local-only@127.0.0.1:5432/chuvas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: python3 scripts/init-env.py
      - run: docker compose -f docker-compose.yml -f compose.local.yml config --quiet
